name: M2 USDA Source Candidates
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/m2-fdc-candidates.yml
      - tools/fdc_candidates.py
      - tools/verify_fdc_evidence.py
      - tools/test_verify_fdc_evidence.py
      - fixtures/m2_fdc_reference_evidence.json
      - android/domain/src/main/kotlin/com/foodplan/domain/OfflineRecipes.kt
permissions:
  contents: read
jobs:
  foundation-foods-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official USDA April 2026 Foundation Foods CSV
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 150 \
            -H 'User-Agent: FoodPlanAI-research/0.1' \
            'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2026-04-30.zip' \
            --output /tmp/usda-foundation-foods.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          data=Path('/tmp/usda-foundation-foods.zip')
          assert 100000 < data.stat().st_size < 20000000, 'Unexpected USDA dataset size'
          with zipfile.ZipFile(data) as z:
              assert z.testzip() is None, 'Bad USDA ZIP checksum'
              assert any(name.endswith('/food.csv') or name=='food.csv' for name in z.namelist())
              assert any(name.endswith('/food_nutrient.csv') or name=='food_nutrient.csv' for name in z.namelist())
          print('PASS USDA source ZIP downloaded and validated')
          PY
      - name: Independently compare all cited Kotlin macros with original USDA CSV
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_verify_fdc_evidence.py' -v
          python tools/verify_fdc_evidence.py /tmp/usda-foundation-foods.zip
      - name: Export review candidates, never mark verified
        run: |
          set -euo pipefail
          mkdir -p m2_source_candidates
          for term in Egg Chicken Rice Tomato Mushroom Potato Carrot Onion Garlic Broccoli Cabbage Lentil Salmon Cod Turkey Beef Pork Apple Banana Pear Milk Oat Yogurt Cheese Wheat Cucumber Pepper Soy Lemon; do
            python tools/fdc_candidates.py /tmp/usda-foundation-foods.zip \
              --contains "$term" --limit 30 \
              --output "m2_source_candidates/${term}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('m2_source_candidates').glob('*.json'))
          assert len(files)==29
          entries=sum(len(json.loads(f.read_text())) for f in files)
          assert entries>0, 'No source records were parsed'
          assert all(item.get('review_status')=='CANDIDATE_NOT_VERIFIED'
                     for f in files for item in json.loads(f.read_text()))
          print('PASS candidate records extracted for human review:', entries)
          manifest={
              'dataset':'USDA FoodData Central Foundation Foods April 2026',
              'source':'https://fdc.nal.usda.gov/download-datasets/',
              'review_status':'CANDIDATE_NOT_VERIFIED',
              'actual_recipe_verification_count':0,
              'queries':{f.stem:len(json.loads(f.read_text())) for f in files},
              'not_found':[f.stem for f in files if not json.loads(f.read_text())]
          }
          Path('m2_source_candidates/manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          parsed=json.loads(Path('m2_source_candidates/manifest.json').read_text(encoding='utf-8'))
          assert parsed['review_status']=='CANDIDATE_NOT_VERIFIED'
          assert parsed['actual_recipe_verification_count']==0
          assert len(parsed['queries'])==29
          print('PASS manifest JSON is readable and marks every SKU as unverified')
          print('Queries with no matches:',manifest['not_found'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m2-usda-food-candidates-unverified
          path: m2_source_candidates/
          if-no-files-found: error
