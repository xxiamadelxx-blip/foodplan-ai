name: M4 real public chain price gate (no address)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/m4_live_chain_price_probe.py'
      - 'tools/test_m4_live_chain_price_probe.py'
      - 'tools/m4_chain_price_batch.py'
      - 'tools/test_m4_chain_price_batch.py'
      - 'tools/m4_live_pilot_basket.py'
      - 'tools/test_m4_live_pilot_basket.py'
      - 'tools/m4_actual_week_coverage.py'
      - 'tools/test_m4_actual_week_coverage.py'
      - 'android/domain/src/test/kotlin/com/foodplan/domain/M4ActualWeekShoppingExportTest.kt'
      - '.github/workflows/m4-public-chain-price.yml'
permissions:
  contents: read
concurrency:
  group: m4-chain-price-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-public-price:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parser, robots and unrelated-product negative tests
        run: python -m unittest discover -s tools -p "test_m4_live_chain_price_probe.py" -v
      - name: Independent whole-package and budget audit negative tests
        run: python -m unittest discover -s tools -p "test_m4_live_pilot_basket.py" -v
      - name: Batch access-safety tests (one robots GET, host 403/429 quarantine)
        run: python -m unittest discover -s tools -p "test_m4_chain_price_batch.py" -v
      - name: Read 33 official SKU pages with fail-closed source circuit breaker
        run: |
          python tools/m4_chain_price_batch.py \
            --output-dir m4-live-chain-price --delay 2
          cat m4-live-chain-price/probe-summary.json
      - name: Price-only two-ingredient basket cross-check
        # A blocked external site must not suppress evidence for the real week.
        # The independent public-price acceptance step still FAILS afterward.
        continue-on-error: true
        run: |
          python tools/m4_live_pilot_basket.py \
            --source-dir m4-live-chain-price \
            --output m4-live-chain-price/two-ingredient-pilot.json
      - name: Full real-week coverage negative tests
        run: python -m unittest discover -s tools -p "test_m4_actual_week_coverage.py" -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision public Android SDK for Gradle configuration
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate ACTUAL 7-day shopping list from production Kotlin planner
        working-directory: android
        run: gradle --no-daemon :domain:test --tests com.foodplan.domain.M4ActualWeekShoppingExportTest
      - name: Compare ACTUAL week with independently read public store prices
        run: |
          python tools/m4_actual_week_coverage.py \
            --shopping android/domain/build/reports/m4-actual-week/shopping.json \
            --prices-dir m4-live-chain-price \
            --budget-rub 356 \
            --output m4-live-chain-price/actual-week-coverage.json
      - name: Independently verify explicit egg-count and oil-volume public quotes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for food, unit, quantity in (("egg","piece",10),("oil","ml",900)):
              file = Path(f"m4-live-chain-price/{food}.json")
              if not file.exists():
                  print(f"BLOCKED {food}: no official source artifact")
                  continue
              row = json.loads(file.read_text(encoding="utf-8"))
              if row.get("status") != "VERIFIED_PUBLIC_CHAIN_PRICE":
                  print(f"BLOCKED {food}: {row.get('reason','price unavailable')}")
                  continue
              assert row["pack_unit"] == unit, food
              assert row["pack_quantity"] == quantity, food
              assert "pack_grams" not in row, food
              assert row["purchase_count_from_grams_proven"] is False, food
              assert row["visible_price_kopeks"] > 0, food
              print(f"PASS OFFICIAL UNIT PACK {food}: {quantity} {unit}, " +
                    f"price {row['visible_price_kopeks']} kopeks, " +
                    "weekly required purchase count remains UNKNOWN")
          PY
      - name: Preserve evidence whether site is available or not
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-chain-price-public-evidence
          path: |
            m4-live-chain-price/*.json
            android/domain/build/reports/m4-actual-week/shopping.json
          if-no-files-found: warn
      - name: Independent public price acceptance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for item in ("rice", "buckwheat"):
              p=Path(f"m4-live-chain-price/{item}.json")
              if not p.is_file():
                  raise SystemExit(f"FAIL: no public source artifact for {item}")
              x=json.loads(p.read_text(encoding="utf-8"))
              if x.get("status") != "VERIFIED_PUBLIC_CHAIN_PRICE":
                  raise SystemExit(f"FAIL: {item} price not independently verified: "
                                   +str(x.get("reason","UNKNOWN")))
              assert x["ingredient_id"] == item
              assert x["visible_price_kopeks"] > 0
              assert x["checkout_price_verified"] is False
              assert x["address_required"] is False
              print(f"PASS: {item} actual public chain price "
                    f"{x['visible_price_kopeks']} kopeks (not checkout)")
          PY
