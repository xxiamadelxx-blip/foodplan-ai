name: FoodPlan Android CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/audit_m0.py'
      - 'tools/m2_gap_manifest.py'
      - 'tools/test_m2_gap_manifest.py'
      - 'contracts/**'
      - 'fixtures/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/audit_m0.py'
      - 'contracts/**'
      - 'fixtures/**'
      - '.github/workflows/android-ci.yml'
permissions:
  contents: read
concurrency:
  group: foodplan-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit project and contract fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python tools/audit_m0.py
          python -m unittest discover -s tools -p "test_m2_gap_manifest.py" -v
          python tools/m2_gap_manifest.py
          python -m unittest discover -s tools -p "test_fdc_candidates.py" -v
          python -m unittest discover -s tools -p "test_verify_fdc_evidence.py" -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and provision API 36
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: JVM tests and debug APK
        working-directory: android
        run: gradle --no-daemon :domain:test :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Export M2 per-recipe review evidence
        working-directory: android
        run: gradle --no-daemon :domain:generateM2RecipeAudit
      - name: Upload M2 ingredient gaps
        uses: actions/upload-artifact@v4
        with:
          name: m2-ingredient-source-gaps
          path: m2-source-gap-report/ingredient-gaps.json
          if-no-files-found: error
      - name: Upload M2 recipe review CSV
        uses: actions/upload-artifact@v4
        with:
          name: m2-recipe-evidence-review
          path: android/domain/build/reports/m2/recipe-review.csv
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foodplan-m1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  emulator-smoke:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Allow emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest
