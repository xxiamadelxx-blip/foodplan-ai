name: FoodPlan Android CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/audit_m0.py'
      - 'tools/audit_no_runtime_ai.py'
      - 'tools/test_audit_no_runtime_ai.py'
      - 'tools/m5_emulator_cold_restart.py'
      - 'tools/test_m5_emulator_cold_restart.py'
      - 'tools/audit_m3_actual_week.py'
      - 'tools/test_audit_m3_actual_week.py'
      - 'tools/m2_gap_manifest.py'
      - 'tools/test_m2_gap_manifest.py'
      - 'tools/verify_ru_tvorog.py'
      - 'tools/test_verify_ru_tvorog.py'
      - 'tools/verify_ru_retail_rice.py'
      - 'tools/test_verify_ru_retail_rice.py'
      - 'tools/verify_ru_supplier_variants.py'
      - 'tools/test_verify_ru_supplier_variants.py'
      - 'tools/m2_review_intake.py'
      - 'tools/test_m2_review_intake.py'
      - 'tools/m4_public_search_scan.py'
      - 'tools/test_m4_public_search_scan.py'
      - 'contracts/**'
      - 'fixtures/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/m5_emulator_cold_restart.py'
      - 'tools/test_m5_emulator_cold_restart.py'
      - 'tools/audit_m3_actual_week.py'
      - 'tools/test_audit_m3_actual_week.py'
      - 'tools/audit_m0.py'
      - 'tools/audit_no_runtime_ai.py'
      - 'tools/test_audit_no_runtime_ai.py'
      - 'tools/m4_public_search_scan.py'
      - 'tools/test_m4_public_search_scan.py'
      - 'contracts/**'
      - 'fixtures/**'
      - '.github/workflows/android-ci.yml'
permissions:
  contents: read
concurrency:
  group: foodplan-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit project and contract fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python tools/audit_m0.py
          python -m unittest discover -s tools -p "test_audit_no_runtime_ai.py" -v
          python -m unittest discover -s tools -p "test_m5_emulator_cold_restart.py" -v
          python tools/audit_no_runtime_ai.py
          python -m unittest discover -s tools -p "test_m2_gap_manifest.py" -v
          python -m unittest discover -s tools -p "test_m2_review_intake.py" -v
          python -m unittest discover -s tools -p "test_audit_m3_actual_week.py" -v
          python -m unittest discover -s tools -p "test_m4_public_search_scan.py" -v
          python -m unittest discover -s tools -p "test_verify_ru_tvorog.py" -v
          python -m unittest discover -s tools -p "test_verify_ru_retail_rice.py" -v
          python -m unittest discover -s tools -p "test_verify_ru_supplier_variants.py" -v
          python tools/verify_ru_supplier_variants.py
          python tools/verify_ru_retail_rice.py
          python tools/m2_gap_manifest.py
          python -m unittest discover -s tools -p "test_fdc_candidates.py" -v
          python -m unittest discover -s tools -p "test_verify_fdc_evidence.py" -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and provision API 36
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: JVM tests and debug APK
        working-directory: android
        run: gradle --no-daemon :domain:test :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Export M2 per-recipe review evidence
        working-directory: android
        run: gradle --no-daemon :domain:generateM2RecipeAudit
      - name: Export 150 authored recipes for independent review
        working-directory: android
        run: gradle --no-daemon :domain:generateM2IndependentReviewQueue
      - name: Fail-closed audit of independent M2 review intake
        run: |
          python tools/m2_review_intake.py android/domain/build/reports/m2/independent-review-queue.csv --output m2-independent-intake/validation.json
      - name: Export real seven-day week from production planner
        working-directory: android
        run: gradle --no-daemon :domain:exportM3ActualWeek
      - name: Independently check required ingredient weights and pack counts
        run: |
          python tools/audit_m3_actual_week.py \
            android/domain/build/reports/m3/actual-week-meals.csv \
            android/domain/build/reports/m3/actual-week-shopping.csv \
            --output m3-actual-week-audit/evidence.json
      - name: Upload planner week and independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-actual-week-independent-evidence
          path: |
            android/domain/build/reports/m3/*.csv
            m3-actual-week-audit/*.json
          if-no-files-found: error
      - name: Upload independent M2 intake gate
        uses: actions/upload-artifact@v4
        with:
          name: m2-independent-review-intake-gate
          path: m2-independent-intake/validation.json
          if-no-files-found: error
      - name: Upload M2 ingredient gaps
        uses: actions/upload-artifact@v4
        with:
          name: m2-ingredient-source-gaps
          path: m2-source-gap-report/ingredient-gaps.json
          if-no-files-found: error
      - name: Upload M2 recipe review CSV
        uses: actions/upload-artifact@v4
        with:
          name: m2-recipe-evidence-review
          path: android/domain/build/reports/m2/recipe-review.csv
          if-no-files-found: error
      - name: Upload complete M2 authored-recipe external review queue
        uses: actions/upload-artifact@v4
        with:
          name: m2-independent-recipe-review-queue
          path: android/domain/build/reports/m2/independent-review-queue.csv
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foodplan-m1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  emulator-smoke:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Allow emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android && gradle --no-daemon :app:connectedDebugAndroidTest
            cd .. && python tools/m5_emulator_cold_restart.py --output m5-cold-restart-evidence
      - name: Publish M5 actual ADB force-stop proof, including FAIL if necessary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-emulator-force-stop-cold-relaunch-evidence
          path: m5-cold-restart-evidence/
          if-no-files-found: warn
