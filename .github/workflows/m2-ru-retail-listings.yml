name: M2 RU retailer public-page evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fixtures/m2_ru_retail_rice_candidates.json'
      - 'tools/verify_ru_retail_rice.py'
      - 'tools/test_verify_ru_retail_rice.py'
      - 'fixtures/m2_ru_multi_supplier_candidates.json'
      - 'tools/verify_ru_supplier_variants.py'
      - 'tools/test_verify_ru_supplier_variants.py'
      - 'tools/m4_public_search_scan.py'
      - 'tools/test_m4_public_search_scan.py'
      - '.github/workflows/m2-ru-retail-listings.yml'
permissions:
  contents: read
jobs:
  official-public-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Manifest identity and negative-safety tests
        run: |
          python -m unittest discover -s tools -p "test_verify_ru_retail_rice.py" -v
          python tools/verify_ru_retail_rice.py
      - name: Independently fetch exact public retailer product cards
        run: |
          python tools/verify_ru_retail_rice.py --live
      - name: Independent supplier variants and declared trace comparison
        if: always()
        run: |
          python -m unittest discover -s tools -p "test_verify_ru_supplier_variants.py" -v
          python tools/verify_ru_supplier_variants.py --live
      - name: Archive evidence and public-page hashes for supplier ambiguity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-ru-retail-multiple-suppliers
          path: m2-supplier-review/multiple-suppliers.json
          if-no-files-found: warn
      - name: Store snapshot hashes and explicitly limited evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-ru-retail-rice-public-pages-only
          path: m2-retail-rice-review/report.json
          if-no-files-found: warn
      # This is an independent M4 discovery pilot, NOT a source of verified
      # package composition, address price or stock. Store outages do not
      # change the independent M2 release and source-evidence gates.
      - name: M4 read-only public search pilot, explicitly separate NOT RELEASE
        continue-on-error: true
        run: |
          python -m unittest discover -s tools -p "test_m4_public_search_scan.py" -v
          python tools/m4_public_search_scan.py \
            --output m4-public-search-review/candidate-discovery.json
      - name: Archive M4 public search pilot, never raw HTTP or invented prices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-independent-public-search-pilot
          path: m4-public-search-review/candidate-discovery.json
          if-no-files-found: warn

